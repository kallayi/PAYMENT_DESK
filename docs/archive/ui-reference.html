<!DOCTYPE html>

  <!-- Inter Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Strict tabular numerals for financial alignment */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Smooth lightweight animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .anim-fade { animation: fadeIn 0.16s ease-out forwards; }
    .anim-drawer { animation: slideInRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-modal { animation: modalIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Safe area padding for mobile PWA bottom nav */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Dedicated A4 Print Stylesheet: hides all app chrome and prints ONLY the official INDFURN sheet */
    @media print {
      @page {
        size: A4 landscape;
        margin: 12mm;
      }
      body * {
        visibility: hidden !important;
      }
      #printable-sheet,
      #printable-sheet * {
        visibility: visible !important;
      }
      #printable-sheet {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

      function loadStore() {

          const raw = localStorage.getItem(STORAGE_KEY);

          const parsed = JSON.parse(raw);

            return createSeedData();
          }
          return parsed;
        } catch (err) {
          return createSeedData();
        }
      }

      let db = loadStore();

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        } catch (err) {
          // Ignore storage quota issues in restricted environments
        }

      const inrFormatter = new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      function formatINR(num) {
        return '₹' + inrFormatter.format(Number(num) || 0);
      }

      function formatINRPlain(num) {
        return inrFormatter.format(Number(num) || 0);
      }

      function netPayable(item) {
        return Math.round(((Number(item.amount) || 0) - (Number(item.tds) || 0)) * 100) / 100;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatHumanDate(isoDate) {
        if (!isoDate) return '—';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[parseInt(parts[1], 10) - 1] || parts[1];
        return `${parts[2]} ${m} ${parts[0]}`;
      }

      function formatShortDate(isoDate) {
        if (!isoDate) return '—';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[parseInt(parts[1], 10) - 1] || parts[1];
        return `${parts[2]} ${m}`;
      }

      function formatDDMMYYYY(isoDate) {
        if (!isoDate) return '—';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      function nowTimestamp() {
        const now = new Date();
        const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        return `23 Nov 2026, ${time}`;
      }

      function getCurrentUser() {
        if (!db.currentUserId) return null;
        const u = db.users.find(user => user.id === db.currentUserId);
        if (!u || !u.isActive) return null;
        return u;
      }

        if (role === 'OWNER') return 'approvals';
        if (role === 'ACCOUNTANT') return 'payments';
        return 'upload';

        return db.banks.find(b => b.id === bankId) || { id: bankId, fullName: 'Unknown Bank', shortName: 'Bank', accountMask: '' };

      function getVendor(vendorId) {
        return db.vendors.find(v => v.id === vendorId) || null;

        const map = {
          DRAFT: { label: 'Draft', cls: 'bg-slate-100 text-slate-700 border-slate-200' },
          PENDING_APPROVAL: { label: 'Pending', cls: 'bg-amber-50 text-amber-700 border-amber-200/80' },

          APPROVED: { label: 'Ready to Pay', cls: 'bg-slate-900 text-white border-slate-900' },
          PAID: { label: 'Paid', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200/80' },
          REJECTED: { label: 'Rejected', cls: 'bg-rose-50 text-rose-700 border-rose-200/80' },
          CANCELLED: { label: 'Cancelled', cls: 'bg-slate-100 text-slate-500 border-slate-200' },
        };
        const cfg = map[status] || { label: status, cls: 'bg-slate-100 text-slate-600 border-slate-200' };
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium border whitespace-nowrap ${cfg.cls}">${cfg.label}</span>`;
      }

        const b = getBank(bankId);
        const isAxis = b.shortName.toLowerCase() === 'axis';
        const isSib = b.shortName.toLowerCase() === 'sib';
        const dot = isAxis ? 'bg-[#97144D]' : isSib ? 'bg-[#B91C1C]' : 'bg-slate-600';
        return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-50 text-slate-700 border border-slate-200 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${escapeHtml(b.shortName)}</span>`;
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          try {
            window.lucide.createIcons();
          } catch (e) {}
        }
      }

      function toast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        const iconMap = {
          success: { icon: 'check-circle-2', color: 'text-emerald-600' },
          error: { icon: 'alert-circle', color: 'text-rose-600' },
          info: { icon: 'info', color: 'text-slate-600' },
        };
        const cfg = iconMap[type] || iconMap.info;
        el.className = 'pointer-events-auto anim-modal flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 shadow-lg text-xs font-medium text-slate-800';
        el.innerHTML = `<i data-lucide="${cfg.icon}" class="w-4 h-4 shrink-0 ${cfg.color}"></i><span class="leading-snug">${escapeHtml(message)}</span>`;
        container.appendChild(el);
        refreshIcons();
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.2s ease';
          setTimeout(() => el.remove(), 220);
        }, 3000);
      }

      function copyText(text, label = 'Copied') {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          toast(`${label}: ${text}`, 'info');
        } catch (err) {
          toast(`${label}: ${text}`, 'info');
        }
      }

      // =========================================================================
      // 4. AUTHENTICATED APP SHELL (STRICTLY ROLE-SCOPED NAVIGATION)
      // =========================================================================
      function getNavItems(user) {
        const pendingCount = db.payments.filter(p => p.status === 'PENDING_APPROVAL').length;
        const incomingCount = db.incomingBills.filter(b => b.status === 'NEW').length;

        if (user.role === 'OWNER') {
          return [
            { id: 'approvals', label: 'Approvals', icon: 'check-circle-2', badge: pendingCount },
            { id: 'history', label: 'History', icon: 'clock', badge: 0 },
            { id: 'settings', label: 'Settings', icon: 'settings', badge: 0 },
          ];
        }
        if (user.role === 'ACCOUNTANT') {
          return [
            { id: 'payments', label: 'Payments', icon: 'receipt', badge: incomingCount },
            { id: 'history', label: 'History', icon: 'clock', badge: 0 },
            { id: 'vendors', label: 'Vendors', icon: 'building-2', badge: 0 },
          ];
        }
        // STAFF
        return [
          { id: 'upload', label: 'Upload Bill', icon: 'upload', badge: 0 },
          { id: 'uploads', label: 'My Uploads', icon: 'file-text', badge: 0 },
        ];
      }

      function getPageTitle(route) {
        const titles = {
          approvals: 'Approvals',
          history: 'History',
          settings: 'Settings',
          payments: 'Payments',
          vendors: 'Vendors',
          upload: 'Upload Bill',
          uploads: 'My Uploads',
        };
        return titles[route] || 'INDFURN';
      }

                    >
                      <span class="flex items-center gap-2.5">
                        <i data-lucide="${item.icon}" class="w-4 h-4 ${active ? 'text-slate-900' : 'text-slate-400'}"></i>
                        <span>${item.label}</span>
                      </span>
                      ${item.badge > 0 ? `<span class="tabular-nums text-[11px] font-semibold px-1.5 py-0.5 rounded-full ${active ? 'bg-slate-900 text-white' : 'bg-amber-100 text-amber-800'}">${item.badge}</span>` : ''}
                    </button>

              </nav>

              <!-- User Profile & Sign Out -->
              <div class="p-3 border-t border-slate-200/80">
                <div class="px-2.5 py-2 mb-1">
                  <div class="text-xs font-semibold text-slate-900 truncate">${escapeHtml(user.fullName)}</div>
                  <div class="text-[11px] text-slate-500">${roleLabel}</div>

                >
                  <i data-lucide="log-out" class="w-3.5 h-3.5 text-slate-400"></i>

              </div>
            </aside>

            <!-- MAIN COLUMN -->
            <div class="flex-1 lg:pl-56 flex flex-col min-w-0 pb-20 lg:pb-8">
              <!-- MOBILE MINIMAL TOP BAR (h-14, < lg) -->
              <header class="lg:hidden sticky top-0 z-20 h-14 bg-white/95 backdrop-blur border-b border-slate-200 px-4 flex items-center justify-between">

                  <div class="w-6 h-6 rounded-md bg-slate-900 text-white flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 7h16M4 12h16M4 17h10" />

                  <span class="text-sm font-semibold text-slate-900">${getPageTitle(ui.activeRoute)}</span>

                <div class="flex items-center gap-2">

            <!-- MOBILE FIXED BOTTOM TAB NAVIGATION (h-16, < lg) -->

                      <div class="relative">
                        <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        ${item.badge > 0 ? `<span class="absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-amber-600 text-white text-[10px] font-semibold tabular-nums flex items-center justify-center">${item.badge}</span>` : ''}

      // =========================================================================
      // 5. ROLE 1: OWNER / ADMIN VIEWS
      // =========================================================================
      function renderOwnerApprovals() {
        const pendingItems = db.payments.filter(p => p.status === 'PENDING_APPROVAL');
        const holdItems = db.payments.filter(p => p.status === 'ON_HOLD');

        const totalPending = pendingItems.reduce((sum, p) => sum + netPayable(p), 0);
        const activeBanks = db.banks.filter(b => b.isActive);

        // Compute bank-wise split for pending items
        const bankSplits = activeBanks.map(b => {
          const sum = pendingItems.filter(p => p.bankId === b.id).reduce((acc, p) => acc + netPayable(p), 0);
          return { bank: b, total: sum };
        });

        const visibleItems = ui.ownerApprovalTab === 'PENDING_APPROVAL' ? pendingItems : holdItems;

        // Group by sheetDate (descending)
        const grouped = {};
        visibleItems.forEach(item => {
          if (!grouped[item.sheetDate]) grouped[item.sheetDate] = [];
          grouped[item.sheetDate].push(item);
        });
        const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

        return `
          <!-- Desktop Title -->
          <div class="hidden lg:flex items-center justify-between mb-5">
            <div>
              <h1 class="text-xl font-semibold tracking-tight text-slate-900">Approvals</h1>
              <p class="text-xs text-slate-500 mt-0.5">Review incoming payment requests and authorize transfers.</p>
            </div>
          </div>

          <!-- Single Compact Top Summary Bar -->
          <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="text-xs font-medium text-slate-500">Pending Approval</div>
              <div class="mt-0.5 flex items-baseline gap-2.5">
                <span class="text-2xl font-bold tracking-tight text-slate-900 tabular-nums">${formatINR(totalPending)}</span>
                <span class="text-xs font-medium text-slate-500 tabular-nums">${pendingItems.length} item${pendingItems.length === 1 ? '' : 's'}</span>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              ${bankSplits.map(s => `
                <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                  <span class="font-medium text-slate-500">${escapeHtml(s.bank.shortName)}:</span>
                  <span class="font-semibold text-slate-900 tabular-nums">${formatINR(s.total)}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- 2-Tab Pill Toggle -->
          <div class="inline-flex items-center p-1 rounded-lg bg-slate-100 border border-slate-200/80 mb-5">
            <button
              type="button"
              onclick="app.setOwnerApprovalTab('PENDING_APPROVAL')"
              class="min-h-[38px] px-3.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${ui.ownerApprovalTab === 'PENDING_APPROVAL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}"
            >
              <span>Pending</span>
              <span class="tabular-nums text-[11px] px-1.5 py-0.2 rounded-full ${ui.ownerApprovalTab === 'PENDING_APPROVAL' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-600'}">${pendingItems.length}</span>
            </button>
            <button
              type="button"
              onclick="app.setOwnerApprovalTab('ON_HOLD')"
              class="min-h-[38px] px-3.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${ui.ownerApprovalTab === 'ON_HOLD' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}"
            >
              <span>On Hold</span>
              <span class="tabular-nums text-[11px] px-1.5 py-0.2 rounded-full ${ui.ownerApprovalTab === 'ON_HOLD' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-600'}">${holdItems.length}</span>
            </button>
          </div>

          <!-- Date-Grouped 4-Row Approval Cards -->
          ${sortedDates.length === 0 ? `
            <div class="bg-white rounded-xl border border-slate-200 p-10 text-center">
              <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="check" class="w-5 h-5"></i>
              </div>
              <div class="text-sm font-semibold text-slate-900">
                ${ui.ownerApprovalTab === 'PENDING_APPROVAL' ? 'All pending payments cleared' : 'No payments on hold'}
              </div>
              <p class="text-xs text-slate-500 mt-1">New requests from Accounts will appear here automatically.</p>
            </div>
          ` : sortedDates.map(date => `
            <section class="mb-6">
              <div class="flex items-center gap-2 mb-3">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 tabular-nums">${formatHumanDate(date)}</h2>
                <span class="text-xs text-slate-400">(${grouped[date].length} item${grouped[date].length === 1 ? '' : 's'})</span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                ${grouped[date].map(item => renderOwnerCard(item, activeBanks)).join('')}
              </div>
            </section>
          `).join('')}
        `;
      }

      function renderOwnerCard(item, activeBanks) {
        const net = netPayable(item);
        const isHold = item.status === 'ON_HOLD';

        return `
          <article class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 flex flex-col gap-3.5 hover:border-slate-300 transition-colors">
            <!-- Row 1: Vendor Name | Net Payable Amount -->
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h3 class="text-base font-semibold text-slate-900 truncate">${escapeHtml(item.vendorName)}</h3>
              </div>
              <div class="text-right shrink-0">
                <div class="text-lg font-bold text-slate-900 tabular-nums leading-tight">${formatINR(net)}</div>
                ${item.tds > 0 ? `<div class="text-[11px] font-medium text-amber-700 tabular-nums mt-0.5">TDS: ${formatINR(item.tds)}</div>` : ''}

            <!-- Row 2: Purpose · Ref · Due -->
            <div class="text-xs text-slate-500 flex flex-wrap items-center gap-x-2 gap-y-1">

              <span class="text-slate-300">·</span>
              <span class="tabular-nums">Ref: <span class="text-slate-700">${escapeHtml(item.invoiceRef)}</span></span>
              <span class="text-slate-300">·</span>
              <span class="tabular-nums">Due: ${formatShortDate(item.dueDate)}</span>
            </div>

            <!-- Row 3: Interactive Inline Bank Switcher + View Bill -->
            <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-100">

                <span class="text-xs text-slate-500">Pay via:</span>
                <select

              <button

              >
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                View Bill
              </button>
            </div>

            <!-- Row 4: Clean Action Bar -->
            <div class="flex items-center gap-2 pt-1">
              <button
                type="button"
                onclick="app.openApproveModal('${item.id}')"
                class="flex-[1.5] min-h-[44px] px-3 rounded-lg bg-emerald-700 hover:bg-emerald-800 active:scale-[0.99] text-white text-xs font-semibold inline-flex items-center justify-center gap-1.5 transition-all"
              >
                <i data-lucide="check" class="w-4 h-4"></i>
                Approve
              </button>
              ${isHold ? `
                <button
                  type="button"
                  onclick="app.ownerResumeItem('${item.id}')"
                  class="flex-1 min-h-[44px] px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium transition-colors"
                >
                  Resume
                </button>
              ` : `
                <button
                  type="button"
                  onclick="app.ownerHoldItem('${item.id}')"
                  class="flex-1 min-h-[44px] px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium transition-colors"
                >
                  Hold
                </button>
              `}
              <button
                type="button"
                onclick="app.openRejectModal('${item.id}')"
                class="flex-1 min-h-[44px] px-3 rounded-lg border border-rose-200 bg-white hover:bg-rose-50 text-rose-700 text-xs font-medium transition-colors"
              >
                Reject
              </button>
            </div>
          </article>
        `;
      }

      // --- OWNER SETTINGS VIEW (Team Users & Company Banks) ---
      function renderOwnerSettings() {

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">

          <div class="inline-flex items-center p-1 rounded-lg bg-slate-100 border border-slate-200/80 mb-5">
            <button

              onclick="app.setOwnerSettingsTab('users')"

            <!-- Mobile Users Cards -->
            <div class="md:hidden space-y-3">
              ${db.users.map(u => {

                return `
                  <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <div class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(u.fullName)}</div>
                      <div class="text-xs text-slate-500 mt-0.5">@${escapeHtml(u.username)} · <span class="font-medium text-slate-700">${u.role}</span></div>
                      <div class="text-[11px] mt-1 font-medium ${u.isActive ? 'text-emerald-700' : 'text-slate-400'}">${u.isActive ? 'Active' : 'Disabled'}</div>
                    </div>
                    ${isSelf ? `<span class="text-[11px] text-slate-400 shrink-0">You</span>` : `
                      <button
                        type="button"
                        onclick="app.toggleUserActive('${u.id}')"
                        class="min-h-[44px] px-3.5 rounded-lg border text-xs font-medium shrink-0 ${u.isActive ? 'border-slate-200 text-slate-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}"

                    `}

                `;
              }).join('')}

          ` : `
            <!-- Company Banks List -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${db.banks.map(b => `
                <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 flex items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-semibold text-slate-900">${escapeHtml(b.fullName)}</span>
                      <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-[11px] font-medium">${escapeHtml(b.shortName)}</span>

                  <button

      // =========================================================================
      // 6. ROLE 2: ACCOUNTANT VIEWS
      // =========================================================================
      function renderAccountantPayments() {
        const incoming = db.incomingBills.filter(b => b.status === 'NEW');
        const counts = {
          INCOMING: incoming.length,
          DRAFT: db.payments.filter(p => p.status === 'DRAFT').length,
          PENDING_APPROVAL: db.payments.filter(p => p.status === 'PENDING_APPROVAL' || p.status === 'ON_HOLD').length,
          APPROVED: db.payments.filter(p => p.status === 'APPROVED').length,
          PAID: db.payments.filter(p => p.status === 'PAID').length,
          REJECTED: db.payments.filter(p => p.status === 'REJECTED').length,
        };

        const tabs = [
          { id: 'INCOMING', label: 'Incoming Bills', count: counts.INCOMING },
          { id: 'DRAFT', label: 'Draft', count: counts.DRAFT },
          { id: 'PENDING_APPROVAL', label: 'Pending', count: counts.PENDING_APPROVAL },
          { id: 'APPROVED', label: 'Ready to Pay', count: counts.APPROVED },
          { id: 'PAID', label: 'Paid', count: counts.PAID },
          { id: 'REJECTED', label: 'Rejected', count: counts.REJECTED },
        ];

        let tableRows = [];
        if (ui.accountantTab === 'PENDING_APPROVAL') {
          tableRows = db.payments.filter(p => p.status === 'PENDING_APPROVAL' || p.status === 'ON_HOLD');
        } else if (ui.accountantTab !== 'INCOMING') {
          tableRows = db.payments.filter(p => p.status === ui.accountantTab);
        }

        const totalVisible = tableRows.reduce((sum, p) => sum + netPayable(p), 0);

        return `
          <!-- Top Action Bar -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h1 class="text-xl font-semibold tracking-tight text-slate-900">Payments</h1>
              <p class="text-xs text-slate-500 mt-0.5">Prepare payment requests, track approvals, and close UTRs.</p>
            </div>
            <div class="flex items-center gap-2">
              <button
                type="button"
                onclick="app.openPrintModal()"
                class="min-h-[44px] sm:min-h-[38px] px-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-700 inline-flex items-center gap-1.5 transition-colors"
              >
                <i data-lucide="printer" class="w-3.5 h-3.5 text-slate-500"></i>
                Print Form
              </button>
              <button
                type="button"
                onclick="app.openEntryDrawer()"
                class="flex-1 sm:flex-initial min-h-[44px] sm:min-h-[38px] px-4 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium inline-flex items-center justify-center gap-1.5 transition-colors"
              >
                <i data-lucide="plus" class="w-4 h-4"></i>
                New Entry
              </button>
            </div>
          </div>

          <!-- Single-Row Status Tabs -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-4 border-b border-slate-200">
            ${tabs.map(t => {
              const active = ui.accountantTab === t.id;
              return `
                <button
                  type="button"
                  onclick="app.setAccountantTab('${t.id}')"
                  class="min-h-[38px] px-3 rounded-lg text-xs font-medium whitespace-nowrap inline-flex items-center gap-1.5 transition-colors ${active ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}"
                >
                  <span>${t.label}</span>
                  <span class="tabular-nums text-[11px] px-1.5 py-0.2 rounded-full ${active ? 'bg-white/20 text-white' : 'bg-slate-200/80 text-slate-600'}">${t.count}</span>
                </button>
              `;
            }).join('')}
          </div>

          ${ui.accountantTab === 'INCOMING' ? renderIncomingBillsSection(incoming) : renderPaymentsTableOrCards(tableRows, totalVisible, 'accountant')}
        `;
      }

      function renderIncomingBillsSection(incoming) {
        if (incoming.length === 0) {
          return `
            <div class="bg-white rounded-xl border border-slate-200 p-10 text-center">
              <div class="text-sm font-semibold text-slate-900">No incoming bills from Stock Staff</div>
              <p class="text-xs text-slate-500 mt-1">Uploaded supplier invoices will appear here for conversion into payment entries.</p>
            </div>
          `;
        }

        return `
          <div class="space-y-3">
            ${incoming.map(bill => `
              <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-semibold text-slate-900">${escapeHtml(bill.vendorName)}</span>
                    <span class="text-xs text-slate-500 tabular-nums bg-slate-100 px-2 py-0.5 rounded">Ref: ${escapeHtml(bill.invoiceRef)}</span>
                    ${bill.estimatedAmount ? `<span class="text-xs font-semibold text-slate-900 tabular-nums">${formatINR(bill.estimatedAmount)}</span>` : ''}
                  </div>
                  <div class="text-xs text-slate-500 flex flex-wrap items-center gap-x-2 gap-y-1">
                    <span>Uploaded by ${escapeHtml(bill.uploadedByName)}</span>
                    <span>·</span>
                    <span class="tabular-nums">${formatHumanDate(bill.createdAt)}</span>
                    <span>·</span>
                    <span class="inline-flex items-center gap-1 text-slate-700"><i data-lucide="paperclip" class="w-3 h-3"></i>${escapeHtml(bill.fileName)}</span>
                  </div>
                  ${bill.note ? `<p class="text-xs text-slate-600 pt-0.5">${escapeHtml(bill.note)}</p>` : ''}
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onclick="app.dismissIncomingBill('${bill.id}')"
                    class="min-h-[44px] sm:min-h-[36px] px-3 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-600 transition-colors"
                  >
                    Dismiss
                  </button>
                  <button
                    type="button"
                    onclick="app.openEntryDrawer(null, '${bill.id}')"
                    class="flex-1 sm:flex-initial min-h-[44px] sm:min-h-[36px] px-3.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium inline-flex items-center justify-center gap-1.5 transition-colors"
                  >
                    Create Payment
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      // Shared Clean 7-Column Desktop Table + Mobile Stacked Cards (Used in Accountant Payments & Shared History)
      function renderPaymentsTableOrCards(rows, totalAmount, mode) {
        if (rows.length === 0) {
          return `
            <div class="bg-white rounded-xl border border-slate-200 p-10 text-center">
              <div class="text-sm font-semibold text-slate-900">No payment entries found</div>
              <p class="text-xs text-slate-500 mt-1">Entries matching this view will appear here.</p>
            </div>
          `;
        }

        function renderContextualAction(item, fullWidth = false) {
          const wCls = fullWidth ? 'w-full min-h-[44px]' : 'h-8 px-3';
          if (mode === 'accountant' && item.status === 'DRAFT') {
            return `<button type="button" onclick="event.stopPropagation(); app.openEntryDrawer('${item.id}')" class="${wCls} rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-xs font-medium text-slate-800 transition-colors">Edit / Submit</button>`;
          }
          if (mode === 'accountant' && item.status === 'APPROVED') {
            return `<button type="button" onclick="event.stopPropagation(); app.openUtrModal('${item.id}')" class="${wCls} rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium transition-colors">Enter UTR</button>`;
          }
          return `<button type="button" onclick="event.stopPropagation(); app.openDetailDrawer('${item.id}')" class="${wCls} rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-700 transition-colors">View</button>`;
        }

        return `
          <!-- Desktop 7-Column Table (md+) -->
          <div class="hidden md:block bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    <th class="py-3 pl-4 pr-3">Date</th>
                    <th class="py-3 px-3">Vendor & Ref</th>
                    <th class="py-3 px-3">Purpose & Due</th>
                    <th class="py-3 px-3 text-right">Amount (₹)</th>
                    <th class="py-3 px-3">Bank</th>
                    <th class="py-3 px-3">Status / UTR</th>
                    <th class="py-3 pl-3 pr-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                  ${rows.map(item => {
                    const net = netPayable(item);
                    return `
                      <tr onclick="app.openDetailDrawer('${item.id}')" class="hover:bg-slate-50/80 cursor-pointer transition-colors">
                        <td class="py-3 pl-4 pr-3 text-xs text-slate-600 tabular-nums whitespace-nowrap">${formatShortDate(item.sheetDate)}</td>
                        <td class="py-3 px-3">
                          <div class="font-medium text-slate-900 leading-snug">${escapeHtml(item.vendorName)}</div>
                          <div class="text-xs text-slate-500 tabular-nums mt-0.5">${escapeHtml(item.invoiceRef)}</div>
                        </td>
                        <td class="py-3 px-3">
                          <div class="text-xs font-medium text-slate-700">${escapeHtml(item.purpose)}</div>
                          <div class="text-[11px] text-slate-500 tabular-nums mt-0.5">Due ${formatShortDate(item.dueDate)}</div>
                        </td>
                        <td class="py-3 px-3 text-right whitespace-nowrap">
                          <div class="font-semibold text-slate-900 tabular-nums">${formatINR(net)}</div>
                          ${item.tds > 0 ? `<div class="text-[11px] text-amber-700 tabular-nums mt-0.5">TDS ${formatINR(item.tds)}</div>` : ''}
                        </td>
                        <td class="py-3 px-3">${bankBadge(item.bankId)}</td>
                        <td class="py-3 px-3">
                          <div>${statusBadge(item.status)}</div>
                          ${item.utrNumber ? `<div class="text-[11px] text-slate-500 tabular-nums mt-1 font-medium">${escapeHtml(item.utrNumber)}</div>` : ''}
                        </td>
                        <td class="py-3 pl-3 pr-4 text-right whitespace-nowrap">
                          ${renderContextualAction(item, false)}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
                <tfoot>
                  <tr class="bg-slate-50/90 border-t border-slate-200">
                    <td colspan="3" class="py-3 pl-4 pr-3 text-xs font-medium text-slate-500">${rows.length} item${rows.length === 1 ? '' : 's'}</td>
                    <td class="py-3 px-3 text-right text-sm font-bold text-slate-900 tabular-nums whitespace-nowrap">Total: ${formatINR(totalAmount)}</td>
                    <td colspan="3" class="py-3 px-3"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>

          <!-- Mobile Stacked Cards (< md) -->
          <div class="md:hidden space-y-3">
            ${rows.map(item => {
              const net = netPayable(item);
              return `
                <div onclick="app.openDetailDrawer('${item.id}')" class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(item.vendorName)}</div>
                      <div class="text-xs text-slate-500 tabular-nums mt-0.5">${escapeHtml(item.invoiceRef)} · ${escapeHtml(item.purpose)}</div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-sm font-bold text-slate-900 tabular-nums">${formatINR(net)}</div>
                      ${item.tds > 0 ? `<div class="text-[11px] text-amber-700 tabular-nums">TDS ${formatINR(item.tds)}</div>` : ''}
                    </div>
                  </div>
                  <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      ${bankBadge(item.bankId)}
                      ${statusBadge(item.status)}
                    </div>
                    <span class="text-[11px] text-slate-500 tabular-nums">Due ${formatShortDate(item.dueDate)}</span>
                  </div>
                  ${item.utrNumber ? `<div class="text-[11px] text-slate-600 tabular-nums bg-slate-50 px-2.5 py-1.5 rounded-md border border-slate-200/70">UTR: <span class="font-semibold text-slate-900">${escapeHtml(item.utrNumber)}</span></div>` : ''}
                  <div class="pt-1">
                    ${renderContextualAction(item, true)}
                  </div>
                </div>
              `;
            }).join('')}
            <div class="bg-white rounded-xl border border-slate-200 px-4 py-3 flex items-center justify-between text-xs">
              <span class="text-slate-500 font-medium">${rows.length} item${rows.length === 1 ? '' : 's'}</span>
              <span class="font-bold text-slate-900 tabular-nums text-sm">Total: ${formatINR(totalAmount)}</span>
            </div>
          </div>
        `;
      }

      // --- ACCOUNTANT VENDORS VIEW ---
      function renderAccountantVendors() {
        const q = ui.vendorSearch.trim().toLowerCase();
        const filtered = db.vendors.filter(v =>
          !q ||
          v.name.toLowerCase().includes(q) ||
          (v.gstin && v.gstin.toLowerCase().includes(q)) ||
          (v.bankAccountNo && v.bankAccountNo.toLowerCase().includes(q))

        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
            <div>
              <h1 class="text-xl font-semibold tracking-tight text-slate-900">Vendors</h1>
              <p class="text-xs text-slate-500 mt-0.5">Supplier directory and beneficiary bank details.</p>
            </div>
            <button
              type="button"
              onclick="app.openAddVendorModal()"
              class="min-h-[44px] sm:min-h-[38px] px-4 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium inline-flex items-center justify-center gap-1.5 transition-colors"
            >
              <i data-lucide="plus" class="w-4 h-4"></i>
              Add Vendor
            </button>
          </div>

          <!-- Search Input -->
          <div class="mb-4 max-w-sm relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input
              type="text"
              value="${escapeHtml(ui.vendorSearch)}"
              oninput="app.setVendorSearch(this.value)"
              placeholder="Search vendor name or GSTIN..."
              class="w-full min-h-[44px] sm:min-h-[38px] pl-9 pr-3 rounded-lg border border-slate-200 bg-white text-sm text-slate-900 placeholder:text-slate-400 outline-none focus:border-slate-500"
            />
          </div>

          <!-- Desktop Vendors Table -->
          <div class="hidden md:block bg-white rounded-xl border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="py-3 pl-5 pr-3">Vendor Name</th>
                  <th class="py-3 px-3">GSTIN</th>
                  <th class="py-3 px-3">Bank Account No</th>
                  <th class="py-3 pl-3 pr-5">IFSC Code</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-sm">
                ${filtered.length === 0 ? `
                  <tr><td colspan="4" class="py-8 text-center text-xs text-slate-500">No vendors found.</td></tr>
                ` : filtered.map(v => `
                  <tr class="hover:bg-slate-50/70">
                    <td class="py-3.5 pl-5 pr-3 font-medium text-slate-900">${escapeHtml(v.name)}</td>
                    <td class="py-3.5 px-3 text-xs text-slate-600 tabular-nums">${escapeHtml(v.gstin || '—')}</td>
                    <td class="py-3.5 px-3 text-xs text-slate-600 tabular-nums">${escapeHtml(v.bankAccountNo || '—')}</td>
                    <td class="py-3.5 pl-3 pr-5 text-xs text-slate-600 tabular-nums">${escapeHtml(v.ifscCode || '—')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Mobile Vendors Cards -->
          <div class="md:hidden space-y-3">
            ${filtered.map(v => `
              <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-1.5">
                <div class="text-sm font-semibold text-slate-900">${escapeHtml(v.name)}</div>
                <div class="text-xs text-slate-500 tabular-nums">GSTIN: ${escapeHtml(v.gstin || '—')}</div>
                <div class="text-xs text-slate-500 tabular-nums">A/C: ${escapeHtml(v.bankAccountNo || '—')} · IFSC: ${escapeHtml(v.ifscCode || '—')}</div>
              </div>
            `).join('')}
          </div>

      // =========================================================================
      // 7. SHARED HISTORY VIEW (OWNER & ACCOUNTANT ONLY)
      // =========================================================================
      function renderHistoryView() {
        const q = ui.historySearch.trim().toLowerCase();
        const filtered = db.payments.filter(p => {
          if (ui.historyStatus !== 'ALL' && p.status !== ui.historyStatus) return false;

      // =========================================================================
      // 11. PRINTABLE A4 INDFURN PAYMENT APPROVAL FORM
      // =========================================================================
      function renderPrintSheetHtml(selectedDate) {
        let rows = db.payments.filter(p => p.status !== 'DRAFT' && p.status !== 'REJECTED' && p.status !== 'CANCELLED');
        if (selectedDate !== 'ALL') {
          rows = rows.filter(p => p.sheetDate === selectedDate);
        }

        const totalGross = rows.reduce((sum, r) => sum + Number(r.amount || 0), 0);
        const totalTds = rows.reduce((sum, r) => sum + Number(r.tds || 0), 0);

        const firstPrepared = rows.find(r => r.preparedBy);
        const firstApproved = rows.find(r => r.approvedBy);

        return `
          <!-- Header -->
          <div class="mb-5">
            <h1 class="text-center text-lg font-bold tracking-tight text-slate-900">Payment Approval Form</h1>
            <div class="mt-3 flex items-center justify-between text-xs font-semibold text-slate-900 border-b border-slate-800 pb-2">
              <span>INDFURN</span>
              <span class="tabular-nums">Date: ${selectedDate === 'ALL' ? 'All Dates' : formatDDMMYYYY(selectedDate)}</span>
            </div>
          </div>

          <!-- Exact Replicated Table -->
          <table class="w-full border-collapse border border-slate-800 text-xs">
            <thead>
              <tr class="bg-slate-100 text-slate-900 font-semibold">
                <th class="border border-slate-800 py-2 px-1.5 text-center w-10">SL No.</th>
                <th class="border border-slate-800 py-2 px-2 text-left">Vendor/Supplier</th>
                <th class="border border-slate-800 py-2 px-2 text-center">Invoice / Ref No</th>
                <th class="border border-slate-800 py-2 px-2 text-center">Due Date</th>
                <th class="border border-slate-800 py-2 px-2 text-center">Purpose</th>
                <th class="border border-slate-800 py-2 px-2 text-right">Amount (₹)</th>
                <th class="border border-slate-800 py-2 px-2 text-center">TDS (₹)</th>
                <th class="border border-slate-800 py-2 px-2 text-center">Payment Ref NO</th>
                <th class="border border-slate-800 py-2 px-2 text-center">Remarks</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => {
                const bank = getBank(r.bankId);
                return `
                  <tr>
                    <td class="border border-slate-800 py-2 px-1.5 text-center tabular-nums">${i + 1}</td>
                    <td class="border border-slate-800 py-2 px-2 font-medium">${escapeHtml(r.vendorName)}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center tabular-nums">${escapeHtml(r.invoiceRef)}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center tabular-nums whitespace-nowrap">${formatShortDate(r.dueDate)}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center">${escapeHtml(r.purpose)}</td>
                    <td class="border border-slate-800 py-2 px-2 text-right font-medium tabular-nums">${formatINRPlain(r.amount)}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center tabular-nums">${r.tds > 0 ? formatINRPlain(r.tds) : 'NA'}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center tabular-nums text-[11px]">${escapeHtml(r.utrNumber || '')}</td>
                    <td class="border border-slate-800 py-2 px-2 text-center">${escapeHtml(bank.shortName)}</td>
                  </tr>
                `;
              }).join('')}
              ${rows.length < 6 ? Array.from({ length: 6 - rows.length }).map(() => `
                <tr class="h-7">
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                  <td class="border border-slate-800"></td>
                </tr>
              `).join('') : ''}
              <tr class="font-bold bg-slate-50">
                <td colspan="5" class="border border-slate-800 py-2 px-3 text-right">Total</td>
                <td class="border border-slate-800 py-2 px-2 text-right tabular-nums">${formatINRPlain(totalGross)}</td>
                <td class="border border-slate-800 py-2 px-2 text-center tabular-nums">${totalTds > 0 ? formatINRPlain(totalTds) : 'NA'}</td>
                <td colspan="2" class="border border-slate-800 py-2 px-2 text-center text-[11px] font-medium text-slate-600">Net: ${formatINR(totalGross - totalTds)}</td>
              </tr>
            </tbody>
          </table>

          <!-- Footer Sign-Off Row -->
          <div class="mt-12 grid grid-cols-3 gap-6 text-xs">
            <div class="text-center">
              <div class="h-10 flex flex-col justify-end pb-1 text-[11px] text-slate-700">
                ${firstPrepared ? `<span class="font-medium">${escapeHtml(firstPrepared.preparedBy)}</span><span class="text-[10px] text-slate-500 tabular-nums">${escapeHtml(firstPrepared.preparedAt || '')}</span>` : ''}
              </div>
              <div class="border-t border-slate-500 pt-1.5 font-semibold text-slate-800">Prepared By</div>
            </div>
            <div class="text-center">
              <div class="h-10"></div>
              <div class="border-t border-slate-500 pt-1.5 font-semibold text-slate-800">Checked By</div>
            </div>
            <div class="text-center">
              <div class="h-10 flex flex-col justify-end pb-1 text-[11px] text-slate-700">
                ${firstApproved ? `<span class="font-semibold text-emerald-700">${escapeHtml(firstApproved.approvedBy)}</span><span class="text-[10px] text-slate-500 tabular-nums">${escapeHtml(firstApproved.approvedAt || '')}</span>` : '<span class="text-[10px] text-slate-400">Awaiting Approval</span>'}
              </div>
              <div class="border-t border-slate-500 pt-1.5 font-semibold text-slate-800">Approved By</div>
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 12. MAIN RENDER ORCHESTRATOR
      // =========================================================================
      function render() {
        const root = document.getElementById('app-root');
        const user = getCurrentUser();

        if (!user) {
          root.innerHTML = renderLoginScreen();
          refreshIcons();
          return;
        }

        // Enforce strict role route guards
        const allowedRoutes = {
          OWNER: ['approvals', 'history', 'settings'],
          ACCOUNTANT: ['payments', 'history', 'vendors'],
          STAFF: ['upload', 'uploads'],
        }[user.role];

        if (!allowedRoutes.includes(ui.activeRoute)) {
          ui.activeRoute = getDefaultRoute(user.role);
        }

        let mainHtml = '';
        if (user.role === 'OWNER') {
          if (ui.activeRoute === 'approvals') mainHtml = renderOwnerApprovals();
          else if (ui.activeRoute === 'history') mainHtml = renderHistoryView();
          else mainHtml = renderOwnerSettings();
        } else if (user.role === 'ACCOUNTANT') {
          if (ui.activeRoute === 'payments') mainHtml = renderAccountantPayments();
          else if (ui.activeRoute === 'history') mainHtml = renderHistoryView();
          else mainHtml = renderAccountantVendors();
        } else {
          if (ui.activeRoute === 'upload') mainHtml = renderStaffUploadView();
          else mainHtml = renderStaffUploadsList();
        }

        root.innerHTML = renderAppShell(user, mainHtml);
        refreshIcons();
      }

      // =========================================================================
      // 13. PUBLIC APPLICATION CONTROLLERS
      // =========================================================================
      window.app = {
        // --- Auth ---
        fillDemoLogin(username, password) {
          const uInput = document.getElementById('login-username');
          const pInput = document.getElementById('login-password');
          if (uInput) uInput.value = username;
          if (pInput) pInput.value = password;
          ui.loginError = '';
        },

        toggleLoginPassword() {
          const uVal = (document.getElementById('login-username') || {}).value || '';
          const pVal = (document.getElementById('login-password') || {}).value || '';
          ui.showLoginPassword = !ui.showLoginPassword;
          render();
          const uEl = document.getElementById('login-username');
          const pEl = document.getElementById('login-password');
          if (uEl) uEl.value = uVal;
          if (pEl) pEl.value = pVal;
        },

        handleLogin(e) {
          e.preventDefault();
          const username = document.getElementById('login-username').value.trim().toLowerCase();
          const password = document.getElementById('login-password').value;

          const found = db.users.find(u => u.username.toLowerCase() === username && u.password === password);
          if (!found) {
            ui.loginError = 'Invalid username or password. Please try again.';
            render();
            return;
          }
          if (!found.isActive) {
            ui.loginError = 'This account has been disabled by the Administrator.';
            render();
            return;
          }

          ui.loginError = '';
          db.currentUserId = found.id;
          ui.activeRoute = getDefaultRoute(found.role);
          saveStore();
          render();
          toast(`Signed in as ${found.fullName}`, 'success');
        },

        logout() {
          db.currentUserId = null;
          ui.activeRoute = '';
          ui.loginError = '';
          saveStore();
          this.closeDetailDrawer();
          this.closeEntryDrawer();
          this.closeModal();
          this.closePrintModal();
          render();
        },

        resetDemoData() {
          db = createSeedData();
          saveStore();
          ui.loginError = '';
          render();
          toast('Demo data restored to defaults', 'info');
        },

        // --- Navigation & Filters ---
        navigate(route) {
          ui.activeRoute = route;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        setOwnerApprovalTab(tab) {
          ui.ownerApprovalTab = tab;
          render();
        },

        setOwnerSettingsTab(tab) {
          ui.ownerSettingsTab = tab;
          render();
        },

        setAccountantTab(tab) {
          ui.accountantTab = tab;
          render();
        },

        setHistoryFilter(key, value) {
          ui[key] = value;
          render();
        },

        setVendorSearch(val) {
          ui.vendorSearch = val;
          render();
        },

        // --- Owner Actions ---
        ownerSwitchBank(paymentId, newBankId) {
          const item = db.payments.find(p => p.id === paymentId);
          const user = getCurrentUser();
          if (!item || !user || user.role !== 'OWNER' || item.bankId === newBankId) return;
          const oldBank = getBank(item.bankId);
          const newBank = getBank(newBankId);
          item.bankId = newBankId;
          item.auditLogs.push({
            action: 'BANK_CHANGED',
            detail: `Switched source bank from ${oldBank.shortName} to ${newBank.shortName}`,
            actor: user.fullName,
            time: nowTimestamp(),
          });
          saveStore();
          render();
          toast(`Bank switched to ${newBank.fullName}`, 'info');
        },

        openApproveModal(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          if (!item) return;
          const bank = getBank(item.bankId);
          const net = netPayable(item);
          const panel = document.getElementById('modal-panel');
          panel.innerHTML = `
            <div class="p-5 sm:p-6">
              <h3 class="text-base font-semibold text-slate-900">Confirm Payment Approval</h3>
              <p class="text-xs text-slate-500 mt-1">Once approved, vendor, invoice reference, and amount are permanently locked.</p>
              <div class="mt-4 p-3.5 rounded-lg bg-slate-50 border border-slate-200 space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-slate-500">Vendor</span><span class="font-semibold text-slate-900">${escapeHtml(item.vendorName)}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Selected Bank</span><span class="font-medium text-slate-800">${escapeHtml(bank.fullName)}</span></div>
                <div class="flex justify-between pt-2 border-t border-slate-200"><span class="font-medium text-slate-700">Net Payable</span><span class="font-bold text-slate-900 tabular-nums text-sm">${formatINR(net)}</span></div>
              </div>
              <div class="mt-5 flex items-center gap-2.5">
                <button type="button" onclick="app.closeModal()" class="flex-1 min-h-[44px] rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium text-slate-700">Cancel</button>
                <button type="button" onclick="app.confirmApprove('${item.id}')" class="flex-1 min-h-[44px] rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold">Confirm Approve</button>
              </div>
            </div>
          `;
          document.getElementById('modal-root').classList.remove('hidden');
          refreshIcons();
        },

        confirmApprove(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          const user = getCurrentUser();
          if (!item || !user || user.role !== 'OWNER') return;
          const bank = getBank(item.bankId);
          const ts = nowTimestamp();
          item.status = 'APPROVED';
          item.approvedBy = user.fullName;
          item.approvedAt = ts;
          item.auditLogs.push({
            action: 'APPROVED',
            detail: `Approved ${formatINR(netPayable(item))} via ${bank.fullName} · Financial fields locked`,
            actor: user.fullName,
            time: ts,
          });
          saveStore();
          this.closeModal();
          render();
          toast(`Approved ${item.vendorName} (${formatINR(netPayable(item))})`, 'success');
        },

        ownerHoldItem(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          const user = getCurrentUser();
          if (!item || !user || user.role !== 'OWNER') return;
          item.status = 'ON_HOLD';
          item.auditLogs.push({
            action: 'ON_HOLD',
            detail: 'Moved payment request to On Hold',
            actor: user.fullName,
            time: nowTimestamp(),
          });
          saveStore();
          render();
          toast(`${item.vendorName} placed On Hold`, 'info');
        },

        ownerResumeItem(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          const user = getCurrentUser();
          if (!item || !user || user.role !== 'OWNER') return;
          item.status = 'PENDING_APPROVAL';
          item.auditLogs.push({
            action: 'RESUMED',
            detail: 'Returned payment request to Pending Approval',
            actor: user.fullName,
            time: nowTimestamp(),
          });
          saveStore();
          render();
          toast(`${item.vendorName} returned to Pending`, 'info');
        },

        openRejectModal(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          if (!item) return;
          const panel = document.getElementById('modal-panel');
          panel.innerHTML = `
            <div class="p-5 sm:p-6">
              <h3 class="text-base font-semibold text-slate-900">Reject Payment Request</h3>
              <p class="text-xs text-slate-500 mt-1">${escapeHtml(item.vendorName)} · <span class="tabular-nums font-medium text-slate-700">${formatINR(netPayable(item))}</span></p>
              <form onsubmit="app.confirmReject(event, '${item.id}')" class="mt-4 space-y-4">
                <div>
                  <label for="reject-reason-input" class="block text-xs font-medium text-slate-700 mb-1.5">Rejection Reason <span class="text-rose-600">*</span></label>
                  <textarea id="reject-reason-input" rows="3" required placeholder="Specify why this request is rejected..." class="w-full p-3 rounded-lg border border-slate-200 text-sm outline-none focus:border-rose-500 resize-none"></textarea>
                </div>

            banner.classList.add('hidden');
            return;
          }

          const dup = db.payments.some(p =>
            p.id !== editId &&
            p.vendorId === vendorId &&
            p.status !== 'REJECTED' &&
            p.status !== 'CANCELLED' &&
            p.invoiceRef.trim().toLowerCase() === ref

        savePaymentEntry(e, targetStatus) {
          if (e) e.preventDefault();
          const user = getCurrentUser();
          if (!user) return;

          const editId = document.getElementById('entry-edit-id').value;
          const billId = document.getElementById('entry-bill-id').value;
          const sheetDate = document.getElementById('entry-date').value;
          const dueDate = document.getElementById('entry-due').value;
          const vendorId = document.getElementById('entry-vendor').value;
          const vendor = getVendor(vendorId);
          const invoiceRef = document.getElementById('entry-ref').value.trim();
          const purpose = document.getElementById('entry-purpose').value.trim();
          const amount = parseFloat(document.getElementById('entry-amount').value);
          const tds = parseFloat(document.getElementById('entry-tds').value) || 0;
          const bankId = document.getElementById('entry-bank').value;
          const remarks = document.getElementById('entry-remarks').value.trim();

          if (!vendor || !invoiceRef || !purpose || !(amount > 0)) {
            toast('Please fill all required fields with a valid amount', 'error');
            return;
          }
          if (tds < 0 || tds > amount) {
            toast('TDS must be between ₹0 and Gross Amount', 'error');
            return;
          }

          const ts = nowTimestamp();
          const bank = getBank(bankId);

          if (editId) {
            const existing = db.payments.find(p => p.id === editId && p.status === 'DRAFT');
            if (existing) {
              existing.sheetDate = sheetDate;
              existing.dueDate = dueDate;
              existing.vendorId = vendor.id;
              existing.vendorName = vendor.name;
              existing.invoiceRef = invoiceRef;
              existing.purpose = purpose;
              existing.amount = amount;
              existing.tds = tds;
              existing.bankId = bankId;
              existing.remarks = remarks;
              existing.invoiceFileName = ui.entryFileName || existing.invoiceFileName;
              existing.status = targetStatus;
              existing.auditLogs.push({
                action: targetStatus === 'DRAFT' ? 'UPDATED' : 'SUBMITTED',
                detail: targetStatus === 'DRAFT'
                  ? `Updated draft entry (${formatINR(amount - tds)})`
                  : `Submitted for Owner approval (${formatINR(amount - tds)} via ${bank.shortName})`,
                actor: user.fullName,
                time: ts,
              });
            }
          } else {
            db.payments.unshift({
              id: 'pay-' + Date.now(),
              sheetDate,
              vendorId: vendor.id,
              vendorName: vendor.name,
              invoiceRef,
              dueDate,
              purpose,
              amount,
              tds,
              bankId,
              status: targetStatus,
              utrNumber: '',
              invoiceFileName: ui.entryFileName || '',
              receiptFileName: '',
              remarks,
              rejectionReason: '',
              preparedBy: user.fullName,
              preparedAt: ts,
              approvedBy: '',
              approvedAt: '',
              paidBy: '',
              paidAt: '',
              auditLogs: [
                {
                  action: targetStatus === 'DRAFT' ? 'CREATED' : 'SUBMITTED',
                  detail: targetStatus === 'DRAFT'
                    ? `Saved draft entry for ${formatINR(amount - tds)}`
                    : `Submitted for Owner approval (${formatINR(amount - tds)} via ${bank.shortName})`,
                  actor: user.fullName,
                  time: ts,
                },
              ],
            });
          }

          if (billId) {
            const bill = db.incomingBills.find(b => b.id === billId);
            if (bill) bill.status = 'CONVERTED';
          }

          saveStore();
          this.closeEntryDrawer();
          ui.accountantTab = targetStatus === 'DRAFT' ? 'DRAFT' : 'PENDING_APPROVAL';
          render();
          toast(targetStatus === 'DRAFT' ? 'Saved as draft' : 'Submitted for Owner approval', 'success');
        },

        validateUtrInput(rawVal, currentPaymentId) {
          const normalized = rawVal.trim().toUpperCase();
          const errEl = document.getElementById('utr-dup-error');
          const submitBtn = document.getElementById('utr-submit-btn');
          if (!errEl || !submitBtn) return true;

          if (!normalized) {
            errEl.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            return false;
          }

          const duplicate = db.payments.find(p => p.id !== currentPaymentId && p.utrNumber && p.utrNumber.trim().toUpperCase() === normalized);
          if (duplicate) {
            errEl.textContent = `Duplicate UTR: "${normalized}" is already recorded on ${duplicate.vendorName} (${duplicate.invoiceRef}).`;
            errEl.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            return false;
          }

          errEl.classList.add('hidden');
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          return true;
        },

          const ts = nowTimestamp();
          item.status = 'PAID';

                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Bank Account No</label>
                    <input id="av-acc" type="text" placeholder="Account number" class="w-full min-h-[44px] px-3 rounded-lg border border-slate-200 text-sm tabular-nums outline-none focus:border-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">IFSC Code</label>
                    <input id="av-ifsc" type="text" placeholder="UTIB0001462" class="w-full min-h-[44px] px-3 rounded-lg border border-slate-200 text-sm uppercase tabular-nums outline-none focus:border-slate-900" />
                  </div>
                </div>
                <div class="pt-2 flex items-center gap-2.5">
                  <button type="button" onclick="app.closeModal()" class="flex-1 min-h-[44px] rounded-lg border border-slate-200 bg-white text-xs font-medium text-slate-700">Cancel</button>
                  <button type="submit" class="flex-1 min-h-[44px] rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Save Vendor</button>
                </div>
              </form>
            </div>
          `;
          document.getElementById('modal-root').classList.remove('hidden');
        },

        handleAddVendor(e) {
          e.preventDefault();
          const name = document.getElementById('av-name').value.trim();
          const gstin = document.getElementById('av-gstin').value.trim().toUpperCase();
          const bankAccountNo = document.getElementById('av-acc').value.trim();
          const ifscCode = document.getElementById('av-ifsc').value.trim().toUpperCase();
          const errEl = document.getElementById('av-err');

          if (db.vendors.some(v => v.name.toLowerCase() === name.toLowerCase())) {
            errEl.textContent = 'A vendor with this name already exists.';
            errEl.classList.remove('hidden');
            return;
          }

          db.vendors.push({ id: 'vnd-' + Date.now(), name, gstin, bankAccountNo, ifscCode });
          saveStore();
          this.closeModal();
          render();
          toast(`Added vendor "${name}"`, 'success');
        },

        // --- Stock Staff Actions ---
        handleStaffFilePick(input) {
          if (input.files && input.files[0]) {
            ui.staffSelectedFile = input.files[0].name;
            render();
          }
        },

        attachSampleStaffFile() {
          ui.staffSelectedFile = `Supplier_Invoice_${Math.floor(1000 + Math.random() * 9000)}.pdf`;
          render();
        },

        toggleStaffCustomVendor(val) {
          const custom = document.getElementById('staff-vendor-custom');
          if (!custom) return;
          custom.classList.toggle('hidden', val !== '__new__');
          if (val === '__new__') custom.focus();
        },

        handleStaffUpload(e) {
          e.preventDefault();
          const user = getCurrentUser();
          if (!user) return;

          if (!ui.staffSelectedFile) {
            toast('Please select an invoice photo or PDF first', 'error');
            return;
          }

          const selVal = document.getElementById('staff-vendor-select').value;
          let vendorId = null;
          let vendorName = '';

          if (selVal === '__new__') {
            vendorName = document.getElementById('staff-vendor-custom').value.trim();
            if (!vendorName) {
              toast('Please enter the vendor name', 'error');
              return;
            }
            const existing = db.vendors.find(v => v.name.toLowerCase() === vendorName.toLowerCase());
            if (existing) {
              vendorId = existing.id;
              vendorName = existing.name;
            } else {
              const created = { id: 'vnd-' + Date.now(), name: vendorName, gstin: '', bankAccountNo: '', ifscCode: '' };
              db.vendors.push(created);
              vendorId = created.id;
            }
          } else {
            const v = getVendor(selVal);
            vendorId = v ? v.id : null;
            vendorName = v ? v.name : 'Unknown Vendor';
          }

          const invoiceRef = document.getElementById('staff-invoice-ref').value.trim();
          const amtRaw = document.getElementById('staff-amount').value;
          const estimatedAmount = amtRaw ? parseFloat(amtRaw) : null;
          const note = document.getElementById('staff-note').value.trim();

          db.incomingBills.unshift({
            id: 'bill-' + Date.now(),
            vendorId,
            vendorName,
            invoiceRef,
            estimatedAmount,
            note,
            fileName: ui.staffSelectedFile,
            status: 'NEW',
            uploadedBy: user.id,
            uploadedByName: user.fullName,
            createdAt: '2026-11-23',
          });

          ui.staffSelectedFile = '';
          ui.activeRoute = 'uploads';
          saveStore();
          render();
          toast('Invoice sent to Accountant', 'success');
        },

        // --- Shared Drawer, Print, CSV & Utilities ---
        openDetailDrawer(paymentId) {
          const item = db.payments.find(p => p.id === paymentId);
          if (!item) return;
          document.getElementById('detail-drawer-panel').innerHTML = renderDetailDrawerHtml(item);
          document.getElementById('detail-drawer').classList.remove('hidden');
          refreshIcons();
        },

        closeDetailDrawer() {
          document.getElementById('detail-drawer').classList.add('hidden');
        },

        closeModal() {
          document.getElementById('modal-root').classList.add('hidden');
        },

        openPrintModal() {
          const dates = Array.from(new Set(db.payments.filter(p => p.status !== 'DRAFT').map(p => p.sheetDate))).sort((a, b) => b.localeCompare(a));
          const sel = document.getElementById('print-date-select');
          sel.innerHTML = [
            ...dates.map(d => `<option value="${d}">${formatDDMMYYYY(d)}</option>`),
            `<option value="ALL">All Dates</option>`,
          ].join('');
          // Default to 19-11-2026 if present so user sees the classic 4-entry sheet immediately
          if (dates.includes('2026-11-19')) sel.value = '2026-11-19';
          this.renderPrintSheet();
          document.getElementById('print-modal').classList.remove('hidden');
          refreshIcons();
        },

        renderPrintSheet() {
          const selectedDate = document.getElementById('print-date-select').value;
          document.getElementById('printable-sheet').innerHTML = renderPrintSheetHtml(selectedDate);
        },

        closePrintModal() {
          document.getElementById('print-modal').classList.add('hidden');
        },

        exportCsv() {
          const safeCell = (val) => {
            let s = String(val == null ? '' : val);
            if (/^[=+\-@]/.test(s)) s = "'" + s;
            return `"${s.replace(/"/g, '""')}"`;
          };
          const headers = ['Date', 'Vendor', 'Invoice / Ref No', 'Due Date', 'Purpose', 'Amount (INR)', 'TDS (INR)', 'Net Payable (INR)', 'Bank', 'Status', 'UTR / Ref No', 'Remarks'];
          const lines = [
            headers.join(','),
            ...db.payments.map(p => [
              safeCell(p.sheetDate),
              safeCell(p.vendorName),
              safeCell(p.invoiceRef),
              safeCell(p.dueDate),
              safeCell(p.purpose),
              Number(p.amount).toFixed(2),
              Number(p.tds || 0).toFixed(2),
              netPayable(p).toFixed(2),
              safeCell(getBank(p.bankId).shortName),
              safeCell(p.status),
              safeCell(p.utrNumber || ''),
              safeCell(p.remarks || ''),
            ].join(',')),
          ];
          const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'INDFURN_Payments_Export.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          toast('Exported CSV file', 'success');
        },

        copyUtr(utr) {
          copyText(utr, 'UTR Copied');
        },
      };

      // Global Escape key handler
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          app.closeDetailDrawer();
          app.closeEntryDrawer();
          app.closeModal();
          app.closePrintModal();
        }
      });

      // Boot application
      render();
    })();
  </script>
</body>
</html>
